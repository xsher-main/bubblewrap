name: Build TWA APK with Bubblewrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Generate Android Signing Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=ChatGPT TWA, OU=App, O=Self, L=City, S=State, C=US"

      - name: Generate Android Project & Build APK
        run: |
          # 启动本地后台服务提供 icon.png，避免外部网络与 Cloudflare 拦截
          python3 -m http.server 8080 &
          sleep 2

          # 根据 twa-manifest.json 抓取本地图标并生成工程
          bubblewrap update --skipPwaValidation

          # 编译并签名正式版 APK
          bubblewrap build \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android \
            --keyPassword=android \
            --keyStorePassword=android \
            --skipPwaValidation

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-TWA-Release-APK
          path: app-release-signed.apk
          if-no-files-found: error
