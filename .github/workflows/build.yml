name: Build TWA APK with Bubblewrap

on:
  workflow_dispatch: # 支持网页端手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          # 自动接受 GitHub 自带 Android SDK 的许可证
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 预先写入 Bubblewrap 全局配置，避免在 CI 无终端环境下弹出交互式输入导致挂起
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Generate Android Signing Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=ChatGPT TWA, OU=App, O=Self, L=City, S=State, C=US"

      - name: Generate Android Project & Build APK
        run: |
          # 根据仓库中的 twa-manifest.json 生成 Android 工程结构
          bubblewrap update --skipPwaValidation

          # 编译并签名生成正式版 APK
          bubblewrap build \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android \
            --keyPassword=android \
            --keyStorePassword=android \
            --skipPwaValidation

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-TWA-Release-APK
          path: app-release-signed.apk
          if-no-files-found: error
